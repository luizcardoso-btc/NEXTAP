<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Declaração de conteúdo · NexTap</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
:root{--pr:#15803d;--bg:#f6f7f9;--cd:#fff;--tx:#111827;--mu:#6b7280;--bd:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--cd:#181b21;--tx:#f3f4f6;--mu:#9ca3af;--bd:#2a2f38}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:20px;margin:0 0 4px}.mut{color:var(--mu);font-size:13px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:block;font-size:12px;font-weight:600;color:var(--mu)}
input,select{width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit}
button{padding:9px 14px;border-radius:9px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font:inherit;font-weight:600;cursor:pointer}
button.p{background:var(--pr);border-color:var(--pr);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--bd)}th{font-size:12px;color:var(--mu)}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:#dcfce7;color:#166534}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
#aviso{display:none;background:#fef3c7;color:#92400e;border-radius:10px;padding:10px 12px;margin-top:12px}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<main>
  <h1>Declaração de conteúdo</h1>
  <div class="mut">Gerada automaticamente quando o pedido é pago. <a href="/admin/" style="color:var(--pr)">← Voltar ao painel</a></div>
  <div id="aviso"></div>

  <div class="card">
    <b>Dados do remetente (sua empresa)</b>
    <div class="mut" style="margin:2px 0 10px">Aparecem em todas as declarações. Preencha uma vez.</div>
    <div class="grid" id="cfg"></div>
    <div class="row"><button class="p" onclick="salvar()">Salvar dados</button><span class="mut" id="msg"></span></div>
  </div>

  <div class="card">
    <div class="row" style="margin:0;justify-content:space-between">
      <b>Pedidos pagos</b>
      <button onclick="pendentes()">Gerar as que faltam</button>
    </div>
    <div class="scroll"><table style="margin-top:8px"><thead><tr><th>Pedido</th><th>Revendedor</th><th>Placas</th><th>Destino</th><th>Pago em</th><th></th></tr></thead><tbody id="lista"></tbody></table></div>
    <div class="mut" id="vazio" style="display:none;padding:10px 0">Nenhum pedido pago ainda.</div>
  </div>
</main>
<script>
var TOKEN=null;try{TOKEN=localStorage.getItem('nx_admin_token')}catch(e){}
var $=function(i){return document.getElementById(i)};
var E=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var CAMPOS=[['rem_nome','Nome / razão social'],['rem_doc','CPF / CNPJ'],['rem_cep','CEP'],['rem_rua','Rua'],['rem_numero','Número'],['rem_complemento','Complemento'],['rem_bairro','Bairro'],['rem_cidade','Cidade'],['rem_uf','UF'],['decl_descricao','Descrição do conteúdo'],['decl_peso_unit_kg','Peso de cada placa (kg)']];
function aviso(t){var a=$('aviso');a.textContent=t;a.style.display=t?'block':'none'}
async function api(p,o){o=o||{};o.headers=Object.assign({Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'},o.headers||{});
  var r=await fetch('/api/admin/declaracao'+p,o);
  if(r.status===401){aviso('Sessão expirada. Entre novamente em /admin/ e volte para esta página.');throw new Error('401')}
  if(!r.ok){var j={};try{j=await r.json()}catch(e){}throw new Error(j.error||'Erro inesperado.')}
  return r}
async function carregar(){
  if(!TOKEN){aviso('Entre primeiro no painel em /admin/ e depois abra esta página.');return}
  try{
    var c=await (await api('/config')).json();
    $('cfg').innerHTML=CAMPOS.map(function(x){return '<label>'+x[1]+'<input id="'+x[0]+'" value="'+E(c[x[0]])+'"></label>'}).join('')
      +'<label>Texto da declaração<select id="decl_modo"><option value="com_nfe"'+(c.decl_modo==='com_nfe'?' selected':'')+'>Mercadoria acompanha NF-e</option><option value="nao_contribuinte"'+(c.decl_modo==='nao_contribuinte'?' selected':'')+'>Não contribuinte (modelo dos Correios)</option></select></label>';
    var l=await (await api('/pedidos')).json();
    $('vazio').style.display=l.length?'none':'block';
    $('lista').innerHTML=l.map(function(p){return '<tr><td><b>'+E(p.numero)+'</b></td><td>'+E(p.revendedor)+'</td><td>'+p.qtd+'</td><td>'+E([p.ship_city,p.ship_state].filter(Boolean).join('/')||'—')+'</td><td>'+(p.paid_at?new Date(p.paid_at.replace(' ','T')+'Z').toLocaleDateString('pt-BR'):'—')+'</td><td style="text-align:right"><button onclick="baixar('+p.id+')">⬇ PDF</button></td></tr>'}).join('');
  }catch(e){if(e.message!=='401')aviso(e.message)}
}
async function salvar(){var b={};CAMPOS.concat([['decl_modo']]).forEach(function(x){b[x[0]]=$(x[0]).value});
  try{await api('/config',{method:'PUT',body:JSON.stringify(b)});$('msg').textContent='Dados salvos ✓';setTimeout(function(){$('msg').textContent=''},3000)}catch(e){alert(e.message)}}
async function baixar(id){
  try{var r=await api('/pedido/'+id+'.pdf?refazer=1');var b=await r.blob(),a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download='declaracao-pedido-'+String(id).padStart(5,'0')+'.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},5000)}
  catch(e){if(e.message!=='401')alert(e.message)}}
async function pendentes(){try{var j=await (await api('/gerar-pendentes',{method:'POST'})).json();alert(j.geradas+' declaração(ões) gerada(s).');carregar()}catch(e){if(e.message!=='401')alert(e.message)}}
carregar();
</script>
</body>
</html>
